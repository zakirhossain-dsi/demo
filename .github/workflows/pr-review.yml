name: AI pull request review
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    # Secrets are withheld from fork PRs, so the agent cannot authenticate there.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the agent can diff against the base branch

      - name: Gemini review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.8-flash
          github_pr_number: ${{ github.event.pull_request.number }}
          # Must be a JSON array: the action installs these via `jq -r '.[]'`.
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          # Wires up the GitHub MCP server so the agent can open a pending review,
          # attach inline comments to specific lines, and submit it.
          # "tools": {"core": []} disables the CLI's local file-write and shell tools.
          settings: |
            {
              "model": { "maxSessionTurns": 25 },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run", "-i", "--rm",
                    "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              },
              "tools": { "core": [] }
            }
          prompt: |
            /pr-code-review

            Apply the project review guidelines in .github/gemini-review-guidelines.md.
            Submit the review as REQUEST_CHANGES only if you found at least one
            critical-severity issue as defined in that file; otherwise submit as COMMENT.

      - name: Gate on critical findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            --jq '[.[] | select(.user.type == "Bot")] | last | .state // "NONE"')
          echo "Latest bot review state: $state"
          if [ "$state" = "CHANGES_REQUESTED" ]; then
            echo "::error::Critical findings in the AI review. See the inline PR comments."
            exit 1
          fi
